<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E-Commerce Sales Prediction</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            font-family: 'Poppins', sans-serif;
        }

        .card-custom {
            max-width: 500px;
            margin: auto;
            margin-top: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .btn-custom {
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="card card-custom p-4">

    <h3 class="text-center mb-4">💰 Sales Prediction</h3>

    <form>

        <div class="mb-3">
            <label>Country</label>
            <select id="country" class="form-select" required>
                <option value="">Select country</option>
                <option>United Kingdom</option>
                <option>France</option>
                <option>Australia</option>
                <option>Ireland</option>
                <option>Germany</option>
                <option>Portugal</option>
                <option>Poland</option>
                <option>Netherlands</option>
                <option>Spain</option>
                <option>Cyprus</option>
                <option>Belgium</option>
                <option>Greece</option>
                <option>Norway</option>
                <option>Austria</option>
                <option>United Arab Emirates</option>
                <option>Denmark</option>
                <option>Italy</option>
                <option>Switzerland</option>
                <option>Sweden</option>
                <option>United States</option>
                <option>Japan</option>
                <option>Finland</option>
                <option>Malta</option>
                <option>South Africa</option>
                <option>Singapore</option>
                <option>Bahrain</option>
                <option>Israel</option>
                <option>Thailand</option>
                <option>Lithuania</option>
                <option>Nigeria</option>
                <option>Korea, Rep.</option>
                <option>Brazil</option>
                <option>Canada</option>
                <option>Iceland</option>
</select>
        </div>

        <div class="mb-3">
            <label class="form-label">Quantity Sold</label>
            <input id="quantity_sold" type="number" name="quantity_sold" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Month</label>
            <input id="month" type="number" name="month" class="form-control" min="1" max="12" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Day of Week (Monday=1 - Saturday=6)</label>
            <input id="day_of_week" type="number" name="day_of_week" class="form-control" min="0" max="6" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Order Hour</label>
            <input id="order_hour" type="number" name="order_hour" class="form-control" min="0" max="23" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Weekend</label>
            <select id="is_weekend" name="is_weekend" class="form-control">
                <option value="0">No</option>
                <option value="1">Yes</option>
            </select>
        </div>

        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary flex-fill">
            Predict
            </button>

            <button type="reset" class="btn btn-secondary flex-fill">
            Clear
            </button>
            <div id="result" class="mt-3>
                <div id="result" class="fw-bold fs-5">Prediction: £ --
                </div>
            </div>
        </div>
    </form>

    {% if prediction %}
        <div class="alert alert-success mt-4 text-center">
            💸 Predicted Sales: <strong>{{ prediction }} GBP</strong>
        </div>
    {% endif %}

    {% if error %}
        <div class="alert alert-danger mt-4 text-center">
            ⚠️ Error: {{ error }}
        </div>
    {% endif %}

</div>
<script>
document.querySelector("form").addEventListener("submit", async function(e) {
    e.preventDefault();

    // Obtener valores del formulario
    const country = document.getElementById("country").value;
    const quantity_sold = parseInt(document.getElementById("quantity_sold").value);
    const month = parseInt(document.getElementById("month").value);
    const day_of_week = parseInt(document.getElementById("day_of_week").value);
    const order_hour = parseInt(document.getElementById("order_hour").value);
    const is_weekend = parseInt(document.getElementById("is_weekend").value);

    console.log({
        country,
        quantity_sold,
        month,
        day_of_week,
        order_hour,
        is_weekend
    });


    // Enviar datos al backend
    const response = await fetch("/sales", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            country,
            quantity_sold,
            month,
            day_of_week,
            order_hour,
            is_weekend
        })
    });

    const data = await response.json();
    console.log(data);

    // Mostrar resultado
    document.getElementById("result").innerHTML =
        "Predicción: £ " + data.prediction_gbp;
});

</script>
</body>
</html>
